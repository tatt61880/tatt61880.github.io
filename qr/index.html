<!DOCTYPE html>
<html lang="ja">

<head>
  <title>QR</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=460">
  <link rel="shortcut icon" href="./images/favicon.png?2023.10.27">
  <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png?2023.10.27">

  <link rel="stylesheet" href="./css/main.css?2026.04.25">

  <script defer src="./lib/qrcode.js?2026.04.25"></script>
  <script defer src="./src/main.js?2026.04.25"></script>
</head>

<body>
  <div id="contents">
    <header>
      <h1>QRコード作成ツール</h1>
    </header>
    <ul>
      <li>QRコードは株式会社デンソーウェーブの登録商標です</li>
      <li>日本語・絵文字に対応しています（UTF-8）。</li>
      <li>自己責任でご利用ください</li>
    </ul>
    <div class="inner">
      <input type="text" value="" id="input-text" aria-label="QRコードにする文字列" aria-describedby="error-message">
      <p id="error-message" role="alert" hidden></p>

      <div id="qrcode"></div>
      <div>
        <img id="new-image" alt="入力した文字列のQRコード" hidden>
      </div>
    </div>
  </div>
</body>

</html>
